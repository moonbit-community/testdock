services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example-password
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, example]
      interval: 1s
      timeout: 2s
      retries: 30

  api:
    image: testdock-example-api:local
    build:
      context: ..
      dockerfile: example/Dockerfile
    environment:
      PGHOST: database
      PGDATABASE: example
      PGUSER: postgres
      PGPASSWORD: example-password
    ports:
      - "3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/health]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  database-data:
